<svg viewBox="0 0 200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Hamster Fur Gradient -->
    <linearGradient id="furGradMascot" x1="40" y1="20" x2="160" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF3E0" />
      <stop offset="25%" stop-color="#FFE0B2" />
      <stop offset="65%" stop-color="#FFCC80" />
      <stop offset="100%" stop-color="#FFA726" />
    </linearGradient>

    <!-- Hamster Cream Tummy & Cheeks -->
    <linearGradient id="creamGradMascot" x1="100" y1="70" x2="100" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF8F0" />
    </linearGradient>

    <!-- Ear Outer -->
    <linearGradient id="earOuterMascot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFA726" />
      <stop offset="100%" stop-color="#FB8C00" />
    </linearGradient>

    <!-- Ear Inner Pink -->
    <linearGradient id="earInnerMascot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFB4C4" />
      <stop offset="100%" stop-color="#FF8BA7" />
    </linearGradient>

    <!-- Cheek Blush -->
    <radialGradient id="cheekBlushMascot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5252" stop-opacity="0.55" />
      <stop offset="60%" stop-color="#FF7A8A" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FF7A8A" stop-opacity="0" />
    </radialGradient>

    <!-- Flower Petals -->
    <linearGradient id="flowerGradMascot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Teal Gem -->
    <linearGradient id="tealGemMascot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5EEAD4" />
      <stop offset="60%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>

    <!-- Anime Eye Gradient -->
    <linearGradient id="eyeGradMascot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F1614" />
      <stop offset="70%" stop-color="#3D2014" />
      <stop offset="100%" stop-color="#7C2D12" />
    </linearGradient>

    <radialGradient id="shadowGradMascot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#FB923C" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FB923C" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ground Soft Shadow -->
  <ellipse cx="100" cy="208" rx="58" ry="8" fill="url(#shadowGradMascot)" />

  <!-- Tiny Back Feet -->
  <ellipse cx="72" cy="198" rx="14" ry="7" fill="#FFE0B2" stroke="#F57C00" stroke-width="1.8" />
  <ellipse cx="128" cy="198" rx="14" ry="7" fill="#FFE0B2" stroke="#F57C00" stroke-width="1.8" />

  <!-- Rounded Hamster Ears -->
  <!-- Left Ear -->
  <g>
    <circle cx="56" cy="46" r="22" fill="url(#earOuterMascot)" stroke="#F57C00" stroke-width="2.5" />
    <circle cx="56" cy="46" r="13" fill="url(#earInnerMascot)" />
    <path d="M 50 39 Q 56 36 62 40" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.75" />
  </g>

  <!-- Right Ear -->
  <g>
    <circle cx="144" cy="46" r="22" fill="url(#earOuterMascot)" stroke="#F57C00" stroke-width="2.5" />
    <circle cx="144" cy="46" r="13" fill="url(#earInnerMascot)" />
    <path d="M 138 39 Q 144 36 150 40" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.75" />
  </g>

  <!-- Chubby Hamster Body Silhouette -->
  <path
    d="M 64 64 C 64 36, 136 36, 136 64 C 150 72, 174 96, 170 142 C 166 182, 138 202, 100 202 C 62 202, 34 182, 30 142 C 26 96, 50 72, 64 64 Z"
    fill="url(#furGradMascot)"
    stroke="#F57C00"
    stroke-width="2.5"
  />

  <!-- Chubby Cream Cheeks & Tummy Patch -->
  <path
    d="M 64 100 C 56 128, 44 140, 52 168 C 62 192, 88 198, 100 198 C 112 198, 138 192, 148 168 C 156 140, 144 128, 136 100 C 132 80, 118 74, 100 74 C 82 74, 68 80, 64 100 Z"
    fill="url(#creamGradMascot)"
  />

  <!-- Big Kawaii Eyes with Sparkle -->
  <!-- Left Eye -->
  <g>
    <ellipse cx="76" cy="104" rx="8.5" ry="11.5" fill="url(#eyeGradMascot)" />
    <circle cx="74" cy="100" r="3.6" fill="#FFFFFF" />
    <circle cx="79" cy="108" r="1.6" fill="#FFFFFF" />
    <path d="M 67 92 Q 76 88 85 92" stroke="#5D4037" stroke-width="2.2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Right Eye -->
  <g>
    <ellipse cx="124" cy="104" rx="8.5" ry="11.5" fill="url(#eyeGradMascot)" />
    <circle cx="122" cy="100" r="3.6" fill="#FFFFFF" />
    <circle cx="127" cy="108" r="1.6" fill="#FFFFFF" />
    <path d="M 115 92 Q 124 88 133 92" stroke="#5D4037" stroke-width="2.2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Rosy Blushing Cheeks -->
  <ellipse cx="56" cy="118" rx="14" ry="9" fill="url(#cheekBlushMascot)" />
  <ellipse cx="144" cy="118" rx="14" ry="9" fill="url(#cheekBlushMascot)" />

  <!-- Tiny Heart/Triangle Nose -->
  <path
    d="M 100 110 C 97.5 110, 96 112.5, 98 115 L 100 117.5 L 102 115 C 104 112.5, 102.5 110, 100 110 Z"
    fill="#F43F5E"
  />

  <!-- Sweet ω Smile -->
  <path
    d="M 91 119 Q 95.5 123.5 100 119.5 Q 104.5 123.5 109 119"
    stroke="#5D4037"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Delicate Whiskers -->
  <path d="M 42 115 L 24 112" stroke="#795548" stroke-width="1.4" stroke-linecap="round" opacity="0.6" />
  <path d="M 42 121 L 22 124" stroke="#795548" stroke-width="1.4" stroke-linecap="round" opacity="0.6" />
  <path d="M 158 115 L 176 112" stroke="#795548" stroke-width="1.4" stroke-linecap="round" opacity="0.6" />
  <path d="M 158 121 L 178 124" stroke="#795548" stroke-width="1.4" stroke-linecap="round" opacity="0.6" />

  <!-- Left Front Paw -->
  <g>
    <ellipse cx="78" cy="148" rx="8" ry="9.5" fill="#FFF3E0" stroke="#F57C00" stroke-width="2" />
    <circle cx="75" cy="146" r="1.4" fill="#FFA726" />
    <circle cx="78" cy="145" r="1.4" fill="#FFA726" />
    <circle cx="81" cy="146" r="1.4" fill="#FFA726" />
  </g>

  <!-- Right Waving Front Paw -->
  <g>
    <ellipse cx="128" cy="145" rx="8" ry="9.5" fill="#FFF3E0" stroke="#F57C00" stroke-width="2" />
    <circle cx="125" cy="143" r="1.4" fill="#FFA726" />
    <circle cx="128" cy="142" r="1.4" fill="#FFA726" />
    <circle cx="131" cy="143" r="1.4" fill="#FFA726" />
  </g>

  <!-- Celebration Jewel Pendant on Chest -->
  <g>
    <circle cx="100" cy="151" r="5.5" fill="url(#tealGemMascot)" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="98.5" cy="149" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- Signature Golden Blossom on Ear -->
  <g transform="translate(152, 34)">
    <circle cx="0" cy="-7" r="5" fill="url(#flowerGradMascot)" />
    <circle cx="7" cy="-2" r="5" fill="url(#flowerGradMascot)" />
    <circle cx="4" cy="6" r="5" fill="url(#flowerGradMascot)" />
    <circle cx="-4" cy="6" r="5" fill="url(#flowerGradMascot)" />
    <circle cx="-7" cy="-2" r="5" fill="url(#flowerGradMascot)" />
    <circle cx="0" cy="0" r="4.2" fill="#E11D48" />
    <circle cx="-1" cy="-1" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- Magic Sparkle -->
  <g transform="translate(178, 55)">
    <path d="M 0 -8 Q 0 0 8 0 Q 0 0 0 8 Q 0 0 -8 0 Q 0 0 0 -8 Z" fill="#FBBF24" />
    <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
  </g>
</svg>