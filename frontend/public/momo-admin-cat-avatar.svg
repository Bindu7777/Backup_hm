<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Executive Indigo / Cyan Glow -->
    <linearGradient id="adminCatBg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="50%" stop-color="#DBEAFE" />
      <stop offset="100%" stop-color="#C7D2FE" />
    </linearGradient>

    <!-- Cat Coat Gradient: Soft Warm Cream to Silky Golden-Caramel -->
    <linearGradient id="catFurGrad" x1="40" y1="20" x2="160" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="30%" stop-color="#FEF3C7" />
      <stop offset="70%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Cat Cream Muzzle & Chest -->
    <linearGradient id="catCreamGrad" x1="100" y1="70" x2="100" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFFBEB" />
    </linearGradient>

    <!-- Ear Outer Fur -->
    <linearGradient id="catEarOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Ear Inner Pink -->
    <linearGradient id="catEarInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FECDD3" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>

    <!-- Cheek Blush -->
    <radialGradient id="catCheekBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#FDA4AF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FDA4AF" stop-opacity="0" />
    </radialGradient>

    <!-- Emerald Anime Cat Eyes -->
    <linearGradient id="catEyeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="40%" stop-color="#047857" />
      <stop offset="80%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Executive Collar & Tie -->
    <linearGradient id="executiveCollarGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="50%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Gold Medal / Star Accent -->
    <linearGradient id="catGoldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <clipPath id="adminCatClip">
      <circle cx="100" cy="100" r="94" />
    </clipPath>
  </defs>

  <!-- Avatar Outer Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#adminCatBg)" stroke="#818CF8" stroke-width="4" />

  <g clip-path="url(#adminCatClip)">
    <!-- Perky Triangular Cat Ears -->
    <!-- Left Cat Ear -->
    <g>
      <path
        d="M 44 82 L 40 32 C 40 28, 44 26, 48 30 L 82 56 Z"
        fill="url(#catEarOuter)"
        stroke="#D97706"
        stroke-width="2.2"
        stroke-linejoin="round"
      />
      <path
        d="M 47 70 L 45 36 C 45 34, 48 33, 50 36 L 73 53 Z"
        fill="url(#catEarInner)"
      />
      <!-- Ear Tuft -->
      <path d="M 46 45 Q 52 48 50 56" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.8" />
    </g>

    <!-- Right Cat Ear -->
    <g>
      <path
        d="M 156 82 L 160 32 C 160 28, 156 26, 152 30 L 118 56 Z"
        fill="url(#catEarOuter)"
        stroke="#D97706"
        stroke-width="2.2"
        stroke-linejoin="round"
      />
      <path
        d="M 153 70 L 155 36 C 155 34, 152 33, 150 36 L 127 53 Z"
        fill="url(#catEarInner)"
      />
      <!-- Ear Tuft -->
      <path d="M 154 45 Q 148 48 150 56" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.8" />
    </g>

    <!-- Cute Chubby Cat Head & Body -->
    <path
      d="M 60 70 C 60 48, 140 48, 140 70 C 158 80, 172 108, 166 148 C 160 178, 136 188, 100 188 C 64 188, 40 178, 34 148 C 28 108, 42 80, 60 70 Z"
      fill="url(#catFurGrad)"
      stroke="#D97706"
      stroke-width="2.5"
    />

    <!-- Calico / Amber Face Accent Patches -->
    <path
      d="M 44 76 C 54 84, 58 102, 54 118 C 42 110, 36 94, 44 76 Z"
      fill="#F59E0B"
      opacity="0.5"
    />
    <path
      d="M 156 76 C 146 84, 142 102, 146 118 C 158 110, 164 94, 156 76 Z"
      fill="#F59E0B"
      opacity="0.5"
    />

    <!-- Cream Muzzle & Face Patch -->
    <path
      d="M 68 110 C 62 128, 60 144, 76 162 C 86 172, 114 172, 124 162 C 140 144, 138 128, 132 110 C 128 92, 116 86, 100 86 C 84 86, 72 92, 68 110 Z"
      fill="url(#catCreamGrad)"
    />

    <!-- Forehead Star Stripe (Executive Admin Mark) -->
    <path
      d="M 100 52 L 102.5 62 L 112 63 L 104 69 L 107 78 L 100 72 L 93 78 L 96 69 L 88 63 L 97.5 62 Z"
      fill="url(#catGoldGrad)"
      opacity="0.9"
    />

    <!-- Big Kawaii Cat Eyes (Emerald Green with Twinkle) -->
    <!-- Left Eye -->
    <g>
      <ellipse cx="76" cy="112" rx="9" ry="12" fill="url(#catEyeGrad)" />
      {/* Pupil slit highlight */}
      <ellipse cx="76" cy="112" rx="3.5" ry="10" fill="#042F2E" />
      <circle cx="73" cy="107" r="3.6" fill="#FFFFFF" />
      <circle cx="78.5" cy="116.5" r="1.8" fill="#FFFFFF" />
      <circle cx="74" cy="118" r="1.1" fill="#A7F3D0" />
      <!-- Cat Eyelash Flick -->
      <path d="M 66 102 Q 76 96 86 101" stroke="#374151" stroke-width="2.2" stroke-linecap="round" fill="none" />
      <path d="M 66 102 L 62 100" stroke="#374151" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Right Eye -->
    <g>
      <ellipse cx="124" cy="112" rx="9" ry="12" fill="url(#catEyeGrad)" />
      {/* Pupil slit highlight */}
      <ellipse cx="124" cy="112" rx="3.5" ry="10" fill="#042F2E" />
      <circle cx="121" cy="107" r="3.6" fill="#FFFFFF" />
      <circle cx="126.5" cy="116.5" r="1.8" fill="#FFFFFF" />
      <circle cx="122" cy="118" r="1.1" fill="#A7F3D0" />
      <!-- Cat Eyelash Flick -->
      <path d="M 114 101 Q 124 96 134 102" stroke="#374151" stroke-width="2.2" stroke-linecap="round" fill="none" />
      <path d="M 134 102 L 138 100" stroke="#374151" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Soft Rosy Cheeks -->
    <ellipse cx="56" cy="125" rx="12" ry="7" fill="url(#catCheekBlush)" />
    <ellipse cx="144" cy="125" rx="12" ry="7" fill="url(#catCheekBlush)" />

    <!-- Cute Triangle Pink Nose -->
    <path
      d="M 100 119 C 97.5 119, 96 121, 98 123.5 L 100 126 L 102 123.5 C 104 121, 102.5 119, 100 119 Z"
      fill="#FB7185"
    />

    <!-- Cat Mouth (Cute ω Smile) -->
    <path
      d="M 92 127 Q 96 131 100 127 Q 104 131 108 127"
      stroke="#4B5563"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Dainty Cat Whiskers -->
    <path d="M 46 122 L 24 118" stroke="#4B5563" stroke-width="1.5" stroke-linecap="round" opacity="0.65" />
    <path d="M 46 128 L 22 130" stroke="#4B5563" stroke-width="1.5" stroke-linecap="round" opacity="0.65" />
    <path d="M 48 134 L 28 139" stroke="#4B5563" stroke-width="1.5" stroke-linecap="round" opacity="0.65" />

    <path d="M 154 122 L 176 118" stroke="#4B5563" stroke-width="1.5" stroke-linecap="round" opacity="0.65" />
    <path d="M 154 128 L 178 130" stroke="#4B5563" stroke-width="1.5" stroke-linecap="round" opacity="0.65" />
    <path d="M 152 134 L 172 139" stroke="#4B5563" stroke-width="1.5" stroke-linecap="round" opacity="0.65" />

    <!-- Executive Collar (Royal Indigo) -->
    <path
      d="M 72 158 C 86 166, 114 166, 128 158 L 126 166 C 112 174, 88 174, 74 166 Z"
      fill="url(#executiveCollarGrad)"
    />

    <!-- Executive Bow Tie & Golden Star Badge -->
    <g transform="translate(100, 166)">
      <!-- Bow Wings -->
      <path d="M 0 -1 L -12 -7 L -10 6 Z" fill="#4338CA" />
      <path d="M 0 -1 L 12 -7 L 10 6 Z" fill="#4338CA" />
      <!-- Golden Admin Badge Center -->
      <circle cx="0" cy="0" r="5" fill="url(#catGoldGrad)" stroke="#FFFFFF" stroke-width="1.2" />
      <circle cx="-1" cy="-1" r="1.3" fill="#FFFFFF" />
    </g>

    <!-- Front Cat Paws Resting on Bottom -->
    <g>
      <ellipse cx="80" cy="184" rx="9" ry="8" fill="#FFFDF9" stroke="#D97706" stroke-width="1.8" />
      <circle cx="77" cy="182" r="1.3" fill="#F59E0B" />
      <circle cx="80" cy="181" r="1.3" fill="#F59E0B" />
      <circle cx="83" cy="182" r="1.3" fill="#F59E0B" />
    </g>
    <g>
      <ellipse cx="120" cy="184" rx="9" ry="8" fill="#FFFDF9" stroke="#D97706" stroke-width="1.8" />
      <circle cx="117" cy="182" r="1.3" fill="#F59E0B" />
      <circle cx="120" cy="181" r="1.3" fill="#F59E0B" />
      <circle cx="123" cy="182" r="1.3" fill="#F59E0B" />
    </g>
  </g>
</svg>
